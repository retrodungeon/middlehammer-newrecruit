name: Build Middlehammer 5e foundation
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_foundation.py'
      - '.github/workflows/build-foundation.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve upstream 5th Edition GST
        run: |
          python - <<'PY'
          import pathlib, urllib.request
          url = 'https://raw.githubusercontent.com/AnonymousCheese/WH40K5E/main/Warhammer%2040%2C000%205e.gst'
          request = urllib.request.Request(url, headers={'User-Agent': 'middlehammer-builder'})
          with urllib.request.urlopen(request, timeout=120) as response:
              data = response.read()
          pathlib.Path('upstream.gst').write_bytes(data)
          print('Upstream GST bytes:', len(data))
          PY
      - name: Build full foundation
        run: python tools/build_foundation.py upstream.gst build/Middlehammer-Unification.gst
      - name: Verify preserved structure
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          a = ET.parse('upstream.gst').getroot()
          b = ET.parse('build/Middlehammer-Unification.gst').getroot()
          ns = {'b': 'http://www.battlescribe.net/schema/gameSystemSchema'}
          for tag in ('profileType', 'characteristicType', 'categoryEntry', 'costType', 'forceEntry', 'sharedSelectionEntry', 'sharedSelectionEntryGroup'):
              left = {x.get('id') for x in a.findall('.//b:'+tag, ns)}
              right = {x.get('id') for x in b.findall('.//b:'+tag, ns)}
              assert left == right, f'{tag} definitions changed'
              print(tag, len(left), 'IDs preserved')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: middlehammer-5e-foundation
          path: build/Middlehammer-Unification.gst
          retention-days: 30
