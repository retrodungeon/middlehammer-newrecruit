name: Inspect archived 6th Edition codexes
# Includes experimental conversion audit, modifier audit and FOC review; never publishes.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-sixth-edition.yml'
      - 'tools/inspect_6e_structure.py'
      - 'tools/convert_legacy_6e.py'
jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch preserved 6th Edition archive
        run: |
          python - <<'PY'
          import urllib.request
          url = 'https://github.com/BSData/wh40k-7th-edition/releases/download/v3.1.4/Warhammer_40000_6th_Ed_last_revision.bsr'
          request = urllib.request.Request(url, headers={'User-Agent': 'middlehammer-sixth-inventory'})
          with urllib.request.urlopen(request, timeout=120) as response:
              data = response.read()
          open('sixth.bsr', 'wb').write(data)
          print('Archive bytes:', len(data))
          PY
      - name: Inventory codexes and identify Space Marines 2013
        run: python tools/inspect_6e_archive.py sixth.bsr --output build/sixth-edition-inventory.json
      - name: Inspect Space Marines 2013 and 6e dependency structure
        run: python tools/inspect_6e_structure.py sixth.bsr
      - name: Run experimental 1.x to 2.x translator (not published)
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('sixth.bsr') as archive:
              open('space-marines-2013-legacy.cat','wb').write(archive.read('Space Marines - Codex.cat'))
              open('sixth-edition-legacy.gst','wb').write(archive.read('Warhammer40K.gst'))
          PY
          python tools/convert_legacy_6e.py space-marines-2013-legacy.cat Middlehammer-Unification.gst build/experimental/Space-Marines-2013.cat --report build/experimental/translation-report.json --source-gst sixth-edition-legacy.gst --experimental-gst build/experimental/Middlehammer-6e-profile-types.gst
      - uses: actions/upload-artifact@v4
        with:
          name: sixth-edition-inventory
          path: |
            build/sixth-edition-inventory.json
            build/experimental/Space-Marines-2013.cat
            build/experimental/translation-report.json
            build/experimental/Middlehammer-6e-profile-types.gst
