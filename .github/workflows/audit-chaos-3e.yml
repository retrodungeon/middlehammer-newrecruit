name: Audit 3e Chaos Space Marines integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/preflight_3e.py'
      - '.github/workflows/audit-chaos-3e.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download 5e system and 3e Chaos catalogues
        run: |
          python - <<'PY'
          import pathlib, urllib.parse, urllib.request
          files = {
            'upstream.gst': ('AnonymousCheese/WH40K5E', 'Warhammer 40,000 5e.gst'),
            'chaos-1999.cat': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Chaos Space Marines (1999).cat'),
            'chaos-2002.cat': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Chaos Space Marines (2002).cat'),
          }
          for path, (repo, name) in files.items():
              url = f'https://raw.githubusercontent.com/{repo}/main/{urllib.parse.quote(name)}'
              request = urllib.request.Request(url, headers={'User-Agent': 'middlehammer-3e-audit'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  data = response.read()
              pathlib.Path(path).write_bytes(data)
              print(path, len(data), 'bytes')
          PY
      - name: Build complete 5e foundation
        run: python tools/build_foundation.py upstream.gst build/Middlehammer-Unification.gst
      - name: Audit both 3e Chaos codex versions
        run: |
          python tools/preflight_3e.py chaos-1999.cat build/Middlehammer-Unification.gst --report build/chaos-1999-preflight.json
          python tools/preflight_3e.py chaos-2002.cat build/Middlehammer-Unification.gst --report build/chaos-2002-preflight.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: middlehammer-chaos-3e-preflight
          path: build/*preflight.json
          if-no-files-found: warn
          retention-days: 30
