name: Experimental 2002 Chaos conversion
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/experimental_3e_merge.py'
      - '.github/workflows/experimental-chaos-merge.yml'
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download upstream data
        run: |
          python - <<'PY'
          import pathlib, urllib.parse, urllib.request
          files = {
            'third.gst': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Warhammer 40k 3rd Edition.gst'),
            'fifth.gst': ('AnonymousCheese/WH40K5E', 'Warhammer 40,000 5e.gst'),
            'chaos.cat': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Chaos Space Marines (2002).cat'),
          }
          for path, (repo, filename) in files.items():
              url = f'https://raw.githubusercontent.com/{repo}/main/{urllib.parse.quote(filename)}'
              req = urllib.request.Request(url, headers={'User-Agent': 'middlehammer-experimental-merge'})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  pathlib.Path(path).write_bytes(resp.read())
          PY
      - name: Generate foundation
        run: python tools/build_foundation.py fifth.gst build/base.gst
      - name: Merge 3e definitions and convert Chaos catalogue
        run: python tools/experimental_3e_merge.py chaos.cat third.gst build/base.gst build/Middlehammer-Unification.gst 'build/Chaos Space Marines (2002).cat' --report build/chaos-merge-report.json
      - name: Verify resulting XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          g = ET.parse('build/Middlehammer-Unification.gst').getroot()
          c = ET.parse('build/Chaos Space Marines (2002).cat').getroot()
          assert g.get('id') == c.get('gameSystemId')
          print('Game system and catalogue IDs match')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: middlehammer-chaos-experimental
          path: |
            build/Middlehammer-Unification.gst
            build/Chaos Space Marines (2002).cat
            build/chaos-merge-report.json
          if-no-files-found: warn
          retention-days: 30
