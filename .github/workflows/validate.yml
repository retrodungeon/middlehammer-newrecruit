name: Validate published Middlehammer data
on:
  push:
    paths: ['*.gst', '*.cat', 'tools/validate_middlehammer.py', 'tools/validation-allowlist.json']
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_middlehammer.py
