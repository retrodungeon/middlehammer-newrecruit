name: Middlehammer v0.1 package preflight
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/package_preflight.py'
      - '.github/workflows/package-preflight.yml'
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch original sources for local validation only
        run: |
          python - <<'PY'
          import pathlib, urllib.parse, urllib.request
          sources = {
            'third.gst': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Warhammer 40k 3rd Edition.gst'),
            'fifth.gst': ('AnonymousCheese/WH40K5E', 'Warhammer 40,000 5e.gst'),
            'chaos.cat': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Chaos Space Marines (2002).cat'),
            'guard.cat': ('AnonymousCheese/WH40K5E', 'Imperial Guard.cat'),
          }
          for filename, (repo, path) in sources.items():
              url = f'https://raw.githubusercontent.com/{repo}/main/{urllib.parse.quote(path)}'
              req = urllib.request.Request(url, headers={'User-Agent': 'middlehammer-preflight'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  pathlib.Path(filename).write_bytes(response.read())
          PY
      - name: Generate unified system
        run: python tools/build_unified.py --fifth fifth.gst --third third.gst --guard guard.cat --chaos chaos.cat --output build/unified
      - name: Check catalogue imports and create local test bundle
        run: python tools/package_preflight.py build/unified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: middlehammer-v0.1-local-test-preflight
          path: |
            build/unified/package-preflight.json
            build/unified/unified-validation.json
            build/unified/middlehammer-v0.1-local-test.zip
          if-no-files-found: warn
          retention-days: 14
