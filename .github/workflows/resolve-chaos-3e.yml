name: Resolve 3e Chaos dependencies
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/resolve_cross_edition.py'
      - '.github/workflows/resolve-chaos-3e.yml'
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch source and target game systems and 2002 codex
        run: |
          python - <<'PY'
          import pathlib, urllib.parse, urllib.request
          files = {
            'third.gst': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Warhammer 40k 3rd Edition.gst'),
            'fifth.gst': ('AnonymousCheese/WH40K5E', 'Warhammer 40,000 5e.gst'),
            'chaos.cat': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Chaos Space Marines (2002).cat'),
          }
          for path, (repo, filename) in files.items():
              url = f'https://raw.githubusercontent.com/{repo}/main/{urllib.parse.quote(filename)}'
              req = urllib.request.Request(url, headers={'User-Agent': 'middlehammer-dependency-resolver'})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  data = resp.read()
              pathlib.Path(path).write_bytes(data)
              print(path, len(data), 'bytes')
          PY
      - name: Build Middlehammer foundation
        run: python tools/build_foundation.py fifth.gst build/Middlehammer-Unification.gst
      - name: Resolve inherited 3e definitions
        run: python tools/resolve_cross_edition.py chaos.cat third.gst build/Middlehammer-Unification.gst --report build/chaos-2002-reference-map.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-2002-reference-map
          path: build/chaos-2002-reference-map.json
          if-no-files-found: warn
          retention-days: 30
