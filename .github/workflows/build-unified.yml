name: Unified Middlehammer v0.1 structural build
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_unified.py'
      - '.github/workflows/build-unified.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download required upstream sources
        run: |
          python - <<'PY'
          import pathlib, urllib.parse, urllib.request
          sources = {
            'third.gst': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Warhammer 40k 3rd Edition.gst'),
            'fifth.gst': ('AnonymousCheese/WH40K5E', 'Warhammer 40,000 5e.gst'),
            'chaos.cat': ('KSnyder1986/Warhammer-40k-3rd-Edition', 'Chaos Space Marines (2002).cat'),
            'guard.cat': ('AnonymousCheese/WH40K5E', 'Imperial Guard.cat'),
          }
          for filename, (repo, path) in sources.items():
              url = f'https://raw.githubusercontent.com/{repo}/main/{urllib.parse.quote(path)}'
              request = urllib.request.Request(url, headers={'User-Agent': 'middlehammer-unified-builder'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  payload = response.read()
              pathlib.Path(filename).write_bytes(payload)
              print(filename, len(payload))
          PY
      - name: Build and validate unified system
        run: python tools/build_unified.py --fifth fifth.gst --third third.gst --guard guard.cat --chaos chaos.cat --output build/unified
      - name: Upload generated test package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: middlehammer-unified-v0.1-experimental
          path: build/unified/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish full Guard catalogue to New Recruit repository
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import subprocess
          NS = 'http://www.battlescribe.net/schema/gameSystemSchema'
          old = ET.parse('Middlehammer-Unification.gst').getroot()
          generated = ET.parse('build/unified/Middlehammer-Unification.gst')
          root = generated.getroot()
          root.set('name', 'Middlehammer Unification')
          root.set('revision', '5')
          old_force = old.find(f'{{{NS}}}forceEntries')
          new_force = root.find(f'{{{NS}}}forceEntries')
          if new_force is not None:
              root.remove(new_force)
          root.insert(0, old_force)
          ET.register_namespace('', NS)
          generated.write('Middlehammer-Unification.gst', encoding='utf-8', xml_declaration=True)
          guard_path = Path('build/unified/Imperial Guard - Codex 2009.cat')
          guard_tree = ET.parse(guard_path)
          guard_tree.getroot().set('gameSystemRevision', '5')
          guard_tree.write('Imperial Guard - Codex 2009.cat', encoding='utf-8', xml_declaration=True)
          print('Published Guard units:', sum(e.tag.endswith('selectionEntry') and e.get('type') == 'unit' for e in guard_tree.getroot().iter()))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Middlehammer-Unification.gst 'Imperial Guard - Codex 2009.cat'
          git diff --cached --quiet || (git commit -m 'Publish complete 2009 Imperial Guard codex for New Recruit' && git push)
